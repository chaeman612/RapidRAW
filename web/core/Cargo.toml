[package]
name = "rapidraw-web-core"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-only"
description = "WebAssembly core for RapidRAW Web: RAW decoding and adjustment packing, reusing RapidRAW's Rust sources."

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"
js-sys = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde-wasm-bindgen = "0.6"
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "tiff", "webp", "bmp", "gif"] }
rawler = { git = "https://github.com/CyberTimon/RapidRAW-DngLab.git" }
rayon = "1.12.0"
anyhow = "1.0"
glam = "0.33.5"
nalgebra = "0.35.0"
bytemuck = { version = "1.25", features = ["derive"] }
half = { version = "2.7.1", features = ["bytemuck"] }
log = "0.4"
kamadak-exif = "0.6.1"
chrono = { version = "0.4", features = ["wasmbind"] }
base64 = "0.23"
web-time = "1"
console_error_panic_hook = "0.1"
getrandom = { version = "0.3", features = ["wasm_js"] }
uuid = { version = "1", features = ["js"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1

# rawler (RapidRAW's fork of dnglab) is vendored by scripts/prepare-rawler.sh with
# a tiny patch so it does not call std::time::Instant (unsupported in wasm).
[patch."https://github.com/CyberTimon/RapidRAW-DngLab.git"]
rawler = { path = ".vendor/dnglab/rawler" }
